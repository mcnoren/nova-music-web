<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000"><meta name="description" content="Nova Music for the web. Discover music, explore classical works, and make your own library of songs, albums, playlists and folders.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Nova Music</title><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=34ab085f4a5d">
</head>
<body>
  <a class="skip" href="#content">Skip to music</a>
  <header class="topbar">
    <a class="brand" href="#library" aria-label="Nova Music home"><span class="brand-icon">♪</span><span class="brand-name">Nova Music</span></a>
    <div class="global-navigation"><a class="home-button" href="#library" aria-label="Home"><span data-icon="home"></span></a><form id="search-form" class="global-search" role="search"><button type="submit" class="icon-button" aria-label="Search"><span data-icon="search"></span></button><input id="search-input" name="q" type="search" autocomplete="off" placeholder="What do you want to play?" aria-label="Search music"><button type="button" data-action="clear-search" class="icon-button clear-search" aria-label="Clear search" hidden>×</button><button type="button" data-action="dismiss-keyboard" class="icon-button dismiss-keyboard" aria-label="Dismiss keyboard">⌄</button><a class="browse-button" href="#search" aria-label="Browse music"><span data-icon="album"></span></a></form></div>
    <div class="top-actions"><a href="#classical" class="top-classical">Classical</a><button data-action="import" class="icon-button" aria-label="Add music"><span data-icon="plus"></span></button><button data-action="settings" class="icon-button" aria-label="Open settings"><span data-icon="settings"></span></button><button data-action="profile-menu" class="avatar" aria-label="Profile and settings">N</button></div>
  </header>
  <aside class="sidebar" aria-label="Your library">
    <div class="library-heading"><a href="#library"><span data-icon="home"></span>Home</a><button data-action="new-playlist" class="icon-button" aria-label="New playlist"><span data-icon="plus"></span></button></div>
    <div class="library-filters" aria-label="Filter your library"><button data-action="library-filter" data-value="All" class="active">All</button><button data-action="library-filter" data-value="Playlists">Playlists</button><button data-action="library-filter" data-value="Albums">Albums</button><button data-action="library-filter" data-value="Artists">Artists</button><button data-action="library-filter" data-value="Folders">Folders</button></div>
    <label class="library-search"><span data-icon="search"></span><input id="library-search" type="search" aria-label="Search your library" placeholder="Search your library"></label>
    <div class="side-library"><div id="sidebar-playlists"></div></div>
    <div class="sidebar-bottom"><button id="account-button" data-action="account"><span data-icon="artist"></span><span id="account-label">Sign in</span></button></div>
  </aside>
  <div class="workspace">
    <main id="content" tabindex="-1"><div class="page-heading"><div><p class="eyebrow">YOUR MUSIC</p><h1>Home</h1></div></div><p class="muted">Loading your library…</p></main>
  </div>
  <aside id="player-panel" class="player-panel" hidden aria-label="Now playing"><div class="panel-heading"><div id="panel-switcher" class="panel-tabs" aria-label="Player view"></div><button data-action="close-panel" class="icon-button" aria-label="Close now playing">×</button></div><div id="youtube-host"><div id="youtube-player"></div></div><div id="panel-body"></div></aside>
  <footer class="player-bar" aria-label="Music player">
    <button id="current-song" class="current-song" data-action="player"><span class="art-placeholder small">♪</span><span><strong>Choose a song</strong><small>Choose music from your library or Search</small></span></button>
    <div class="playback"><div class="transport"><button data-action="shuffle" class="icon-button" aria-label="Shuffle" aria-pressed="false"><span data-icon="shuffle"></span></button><button data-action="previous" class="icon-button" aria-label="Previous song"><span data-icon="previous"></span></button><button data-action="toggle-play" class="play-main" aria-label="Play"><span data-icon="play"></span></button><button data-action="next" class="icon-button" aria-label="Next song"><span data-icon="next"></span></button><button data-action="repeat" class="icon-button" aria-label="Repeat off"><span data-icon="repeat"></span></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback position"><span id="duration">0:00</span></div></div>
    <div class="player-tools"><button data-action="output-location" class="icon-button" aria-label="Output location"><span data-icon="screen"></span></button><button data-action="lyrics" class="icon-button" aria-label="Lyrics"><span data-icon="lyrics"></span></button><button data-action="fullscreen-lyrics" class="icon-button" aria-label="Full screen lyrics" title="Full screen lyrics"><span data-icon="expand"></span></button><button data-action="queue" class="icon-button" aria-label="Queue"><span data-icon="queue"></span></button><span data-icon="volume"></span><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
  </footer>
  <nav class="mobile-nav" aria-label="Mobile navigation"><a href="#library" data-nav="library"><span data-icon="home"></span>Home</a><a href="#classical" data-nav="classical"><span data-icon="classical"></span>Classical</a><a href="#search" data-nav="search"><span data-icon="search"></span>Search</a></nav>
  <dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button data-action="close-modal" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <div id="context-menu" class="context-menu" role="menu" hidden></div>
  <div id="update-banner" class="update-banner" role="status" hidden><span>A Nova Music update is ready.</span><button data-action="reload">Refresh</button></div>
  <div id="toast" role="status" aria-live="polite"></div><audio id="audio" preload="metadata"></audio>
  <script type="module" src="app.js?v=b7460cb3043d"></script>
<dialog id="lyrics-fullscreen" class="fullscreen-lyrics" aria-label="Full screen lyrics"><div id="fullscreen-lyrics-body"></div></dialog>
</body></html>
